<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATIVIDADE 1</title>
</head>

<style>
    div{
        border: 5px solid;
        margin-bottom: 15px;
    }
    #Block1{
        background-color: red;
        border-color: rgb(147, 0, 0);
        width: 50px;
        height: 50px;
    }
    #Block2{
        background-color: rgb(26, 255, 0);
        border-color: rgb(5, 147, 0);
        width: 100px;
        height: 50px;
    }
    #Block3{
        background-color: rgb(183, 0, 255);
        border-color: rgb(110, 0, 147);
        width: 50px;   
        height: 100px;
    }
    #Block4{
        background-color: rgb(200, 255, 0);
        border-color: rgb(147, 147, 0);
        width: 100px;   
        height: 100px;
    }
    #MiniBlock{
        background-color: rgb(255, 0, 242);
        border-color: rgb(100, 0, 96);
        width: 50%;   
        height: 50px;
        margin: 20px;
    }

</style>

<body>
    <div id="Block1"></div>
    <div id="Block2"></div>
    <div id="Block3"></div>
    <div id="Block4">
        <div id="MiniBlock"></div>
    </div>
</body>
</html>
